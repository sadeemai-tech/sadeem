<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SADEEM</title>
    <meta name="description" content="SADEEM — the AI coding workstation that must PROVE it is done." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#111111" />
    <!-- Fonts load via CSS @font-face (src/assets/glass-v7.css, local files);
         Vite hashes those URLs at build, so no /src font preloads here
         (they'd 404). The Aurora UI voice is the system stack — no web
         font downloads, the app runs offline. -->
    <style>
      /* SADEEM boot canvas — flat black; a crash can never show a white screen. */
      html, body { margin: 0; padding: 0; background: #000000; height: 100%; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 20px;
        font-family: 'Inter', 'Cairo', system-ui, sans-serif;
        color: #9E9E9E; background: #000000; z-index: 9999;
      }
      #boot .k {
        width: 64px; height: 64px; border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 10px 30px rgba(163, 230, 53, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.06);
        animation: bootpulse 1.6s ease-in-out infinite;
      }
      #boot .k svg { display: block; }
      @keyframes bootpulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: .92; }
      }
      #boot .bar {
        width: 180px; height: 3px; border-radius: 2px; background: #1C1C1C; overflow: hidden;
      }
      #boot .bar i {
        display: block; height: 100%; width: 40%; border-radius: 2px; background: #A3E635;
        animation: bootslide 1.1s ease-in-out infinite alternate;
      }
      @keyframes bootslide { from { transform: translateX(-60%); } to { transform: translateX(280%); } }
      #boot .err { display: none; max-width: 460px; text-align: center; line-height: 1.6; }
      #boot .err b { color: #FFFFFF; }
      #boot .err button {
        margin-top: 10px; padding: 8px 22px; border-radius: 10px; border: 1px solid #2C2C2C;
        background: #111111; color: #EAEAEA; font-size: 14px; cursor: pointer;
      }
      #boot .err button:hover { border-color: #A3E635; color: #A3E635; }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="boot">
      <div class="k" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 1024 1024"><rect width="1024" height="1024" rx="216" fill="#A3E635"/><g transform="translate(202 202) scale(0.62)"><path fill="#000000" d="M421.9 0.0 L394.4 95.6 L366.8 139.8 L320.2 179.9 L190.9 179.9 L190.9 306.8 L158.0 356.9 L89.8 401.2 L0.0 424.8 L95.2 450.7 L160.4 496.2 L85.6 544.5 L0.0 566.4 L96.3 592.9 L165.2 641.9 L190.9 684.4 L190.9 810.6 L327.9 810.6 L367.4 846.6 L393.8 889.1 L421.9 985.3 L446.4 895.6 L493.7 827.7 L538.6 891.4 L565.5 985.3 L596.6 882.0 L622.4 843.1 L657.7 811.2 L830.6 810.6 L834.2 657.2 L867.7 625.4 L911.4 600.6 L1010.2 575.8 L922.2 550.4 L851.6 500.9 L919.2 457.2 L1013.8 434.2 L914.4 403.5 L843.8 346.3 L830.6 323.3 L830.6 179.9 L666.7 179.9 L600.2 110.3 L576.9 54.9 L565.5 0.0 L538.6 94.4 L493.7 158.1 L446.4 90.3 Z"/></g></svg>
      </div>
      <div class="bar"><i></i></div>
      <div id="bootMsg" style="font-size:13px">SADEEM</div>
      <div class="err" id="bootErr">
        <b>SADEEM could not finish starting.</b><br />
        The interface failed to load. Try reloading; if it persists, reinstall the app.<br />
        <span id="bootErrDetail" style="font-size:12px;opacity:.7"></span><br />
        <button onclick="location.reload()">Reload</button>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
