<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="Three connected steps waiting to be chained into a flow">
  <!-- SADEEM v11.11 · flows-empty · hand-authored, license-clean -->
  <defs>
    <linearGradient id="step" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2430"/>
      <stop offset="1" stop-color="#131A23"/>
    </linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#98D83B" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#98D83B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="160" cy="110" rx="132" ry="84" fill="url(#fglow)"/>

  <!-- connector rail -->
  <path d="M78 110 H 242" stroke="rgba(212,224,242,0.18)" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round" fill="none"/>

  <!-- step one -->
  <g class="ill-float">
    <rect x="44" y="82" width="56" height="56" rx="14" fill="url(#step)" stroke="rgba(212,224,242,0.18)" stroke-width="1.5"/>
    <circle cx="72" cy="110" r="9" fill="none" stroke="rgba(233,238,246,0.6)" stroke-width="2.4"/>
    <path d="M72 101 v-4 M72 123 v4 M63 110 h-4 M81 110 h4" stroke="rgba(233,238,246,0.45)" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- step two (the live one) -->
  <g class="ill-float">
    <rect x="132" y="70" width="56" height="56" rx="14" fill="#98D83B"/>
    <rect x="132" y="70" width="56" height="56" rx="14" fill="#0A0E14" opacity="0.08"/>
    <path d="M146 98 l8 8 16 -16" stroke="#0C1103" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- step three -->
  <g class="ill-float">
    <rect x="220" y="82" width="56" height="56" rx="14" fill="url(#step)" stroke="rgba(212,224,242,0.18)" stroke-width="1.5"/>
    <path d="M236 122 c4 -10 10 -14 12 -14 s8 4 12 14" stroke="rgba(233,238,246,0.6)" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <circle cx="248" cy="98" r="3.4" fill="#A9E34D"/>
  </g>

  <!-- ambient stars -->
  <g fill="#E9EEF6">
    <circle cx="60" cy="48" r="1.3" opacity="0.45"/>
    <circle cx="160" cy="36" r="1.5" opacity="0.55"/>
    <circle cx="262" cy="52" r="1.2" opacity="0.4"/>
    <circle cx="290" cy="166" r="1.3" opacity="0.45"/>
    <circle cx="34" cy="168" r="1.2" opacity="0.35"/>
  </g>
  <circle cx="206" cy="44" r="1.6" fill="#98D83B" opacity="0.7"/>
</svg>
